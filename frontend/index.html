<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Show the Receipts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 2.5h14v19l-2.33-1.5-2.34 1.5L12 20l-2.33 1.5L7.33 20 5 21.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M8.5 9.5l2.2 2.2 4.8-4.7M8.5 15.5h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Show the Receipts</span>
    </div>
    <div class="controls">
      <select id="encounter-select" aria-label="Visit"></select>
      <select id="variant-select" aria-label="Transcript source"></select>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden>
    <p id="banner-text"></p>
    <button id="banner-action" class="link-btn" type="button" hidden></button>
    <button id="banner-close" class="icon-btn" type="button" aria-label="Dismiss">×</button>
  </div>

  <main id="page" class="page">
    <div class="journal-col">
      <section id="stats" class="stats" aria-label="Review summary" hidden></section>

      <article class="journal" aria-labelledby="patient-name">
        <header class="journal-head">
          <div>
            <h1 id="patient-name"></h1>
            <p id="patient-meta" class="journal-meta"></p>
          </div>
          <select id="note-select" aria-label="Note"></select>
        </header>

        <div id="journal-body" class="journal-body"></div>
        <textarea id="note-input" class="note-input" spellcheck="false" aria-label="Note text" hidden
                  placeholder="Type or paste a note. Shorthand is fine."></textarea>

        <footer class="journal-actions">
          <button id="audit-btn" class="btn btn-primary" type="button">Check against the visit</button>
          <button id="edit-btn" class="btn btn-ghost" type="button">Edit</button>
          <button id="sample-btn" class="btn btn-ghost" type="button" hidden>Show example</button>
          <span id="status-text" class="status-text" role="status"></span>
        </footer>
      </article>

      <section id="additions-section" class="section" hidden>
        <h2 class="section-title">Missing from the note</h2>
        <ul id="additions" class="rows"></ul>
      </section>

      <details id="followups-section" class="section followups" hidden>
        <summary class="section-title" id="followups-title">Questions to follow up</summary>
        <ul id="followups" class="rows"></ul>
      </details>
    </div>

    <aside id="drawer" class="drawer" aria-label="Source in the visit" hidden>
      <div id="drawer-content"></div>
    </aside>
  </main>
  <div id="backdrop" class="backdrop" hidden></div>

  <footer class="footer">Demo data: ACI-Bench (Yim et al., 2023, CC BY 4.0). Role-played visits, no real patients.</footer>
</body>
</html>
