<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sign in · Show the Receipts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <form id="login-form" class="login-card" novalidate>
      <div class="login-brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 2.5h14v19l-2.33-1.5-2.34 1.5L12 20l-2.33 1.5L7.33 20 5 21.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8.5 9.5l2.2 2.2 4.8-4.7M8.5 15.5h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Show the Receipts</span>
      </div>
      <h1 class="login-title">Sign in</h1>
      <label class="form-field" for="username"><span>Username</span><input id="username" name="username" autocomplete="username" required autofocus></label>
      <label class="form-field" for="password"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button id="login-btn" class="btn btn-primary btn-lg" type="submit">Sign in</button>
      <p class="login-fine">Private demo. Accounts are not open for sign-up.</p>
    </form>
  </main>
  <script>
    "use strict";
    // Only go back to a path on this site after signing in.
    const params = new URLSearchParams(location.search);
    const raw = params.get("next") || "/app/";
    const next = raw.startsWith("/") && !raw.startsWith("//") && !raw.startsWith("/login") ? raw : "/app/";

    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.getElementById("login-error");
      const button = document.getElementById("login-btn");
      error.hidden = true;
      button.disabled = true;
      button.textContent = "Signing in…";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: document.getElementById("username").value, password: document.getElementById("password").value }),
        });
        if (response.ok) {
          location.href = next;
          return;
        }
        let message = "Could not sign in. Try again.";
        try { message = (await response.json()).detail || message; } catch { /* not JSON */ }
        error.textContent = message;
      } catch {
        error.textContent = "Could not reach the server. Check your connection and try again.";
      }
      error.hidden = false;
      button.disabled = false;
      button.textContent = "Sign in";
      document.getElementById("password").select();
    });
  </script>
</body>
</html>
